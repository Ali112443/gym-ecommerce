<mat-toolbar class="site-toolbar">
  <div class="toolbar-content">
    <a routerLink="/" class="store-name" aria-label="Spider House home">
      <span class="brand-mark" aria-hidden="true">S</span>
      <span class="brand-copy">SPIDER<span>HOUSE</span><small>TRAINING EQUIPMENT</small></span>
    </a>
    <nav class="primary-nav" aria-label="Main navigation">
      <a
        routerLink="/products"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        aria-label="Shop"
        title="Shop"
        ><mat-icon aria-hidden="true">storefront</mat-icon><span>Shop</span></a
      >
      <a routerLink="/wishlist" routerLinkActive="active" aria-label="Wishlist" title="Wishlist">
        <mat-icon aria-hidden="true">favorite</mat-icon><span>Wishlist</span>
      </a>
      <a routerLink="/orders" routerLinkActive="active" aria-label="Orders" title="Orders">
        <mat-icon aria-hidden="true">receipt_long</mat-icon><span>Orders</span>
      </a>
    </nav>
    <div class="header-actions">
      <a
        class="cart-link"
        routerLink="/cart"
        aria-label="Shopping bag, {{ store.cartCount() }} items"
      >
        <mat-icon aria-hidden="true">shopping_bag</mat-icon><span class="cart-label">Bag</span>
        @if (store.cartCount()) {
          <b class="cart-count">{{ store.cartCount() }}</b>
        }
      </a>
      <button
        class="theme-button"
        (click)="themeService.toggleTheme()"
        type="button"
        [attr.aria-label]="
          themeService.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'
        "
        title="Toggle color theme"
      >
        @if (themeService.isDarkMode()) {
          <mat-icon>light_mode</mat-icon>
        } @else {
          <mat-icon>dark_mode</mat-icon>
        }
      </button>
      <div class="account-actions">
        <a
          class="sign-in-button account-link"
          routerLink="/profile"
          aria-label="Account"
          title="Account"
        >
          <mat-icon aria-hidden="true">person</mat-icon><span>Account</span>
        </a>
        @if (!store.isLoggedIn()) {
          <a class="sign-up-button" routerLink="/sign-in"><span>Sign in</span></a>
        } @else {
          <button class="sign-up-button" type="button" (click)="store.logout()">
            <span>Sign out</span>
          </button>
        }
      </div>
    </div>
  </div>
</mat-toolbar>
